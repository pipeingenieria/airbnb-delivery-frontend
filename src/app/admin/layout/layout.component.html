<div class="min-h-screen bg-slate-950 text-slate-100 flex font-sans selection:bg-rose-500 selection:text-white overflow-x-hidden">
  
  <!-- OVERLAY DE FONDO EN MÓVIL CUANDO EL MENÚ ESTÁ ABIERTO -->
  @if (menuAbierto()) {
    <div (click)="cerrarMenu()" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-30 md:hidden"></div>
  }

  <!-- SIDEBAR RESPONSIVE (Off-canvas en mobile, fijo en desktop) -->
  <aside class="fixed md:static inset-y-0 left-0 w-72 bg-slate-900 border-r border-slate-800 flex flex-col z-40 transform transition-transform duration-300 ease-in-out"
         [ngClass]="menuAbierto() ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">
    
    <div class="p-6 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-rose-600 to-rose-400 flex items-center justify-center text-white font-black text-lg shadow-lg shadow-rose-500/25">
          L
        </div>
        <div>
          <h2 class="text-base font-bold tracking-tight text-white">Loft Control</h2>
          <p class="text-xs font-medium text-rose-400">Super Admin</p>
        </div>
      </div>
      <!-- Botón de cerrar menú en móvil -->
      <button (click)="cerrarMenu()" class="md:hidden text-slate-400 hover:text-white p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    
    <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
      <p class="px-4 text-[11px] font-bold tracking-wider text-slate-500 uppercase mb-2 mt-2">Principal</p>
      
      <a routerLink="/admin/dashboard" (click)="cerrarMenu()" routerLinkActive="bg-rose-500/10 text-rose-400 border-rose-500/20" 
         class="flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent text-sm font-semibold text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v2z"></path></svg>
        Dashboard
      </a>

      <p class="px-4 text-[11px] font-bold tracking-wider text-slate-500 uppercase mb-2 mt-6">Infraestructura</p>

      <a routerLink="/admin/zonas" (click)="cerrarMenu()" routerLinkActive="bg-rose-500/10 text-rose-400 border-rose-500/20" 
         class="flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent text-sm font-semibold text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
        Zonas Geográficas
      </a>
      
      <a routerLink="/admin/propiedades" (click)="cerrarMenu()" routerLinkActive="bg-rose-500/10 text-rose-400 border-rose-500/20" 
         class="flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent text-sm font-semibold text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        Propiedades (Aptos)
      </a>

      <a routerLink="/admin/categorias" (click)="cerrarMenu()" routerLinkActive="bg-rose-500/10 text-rose-400 border-rose-500/20" 
         class="flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent text-sm font-semibold text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
        Categorías
      </a>
      
      <a routerLink="/admin/aliados" (click)="cerrarMenu()" routerLinkActive="bg-rose-500/10 text-rose-400 border-rose-500/20" 
         class="flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent text-sm font-semibold text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
        Aliados Comerciales
      </a>
    </nav>
  </aside>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-950 w-full">
    
    <!-- HEADER SUPERIOR CON BOTÓN HAMBURGUESA MÓVIL -->
    <header class="h-20 bg-slate-900/50 backdrop-blur-md border-b border-slate-800 px-4 md:px-8 flex justify-between items-center z-20">
      <div class="flex items-center gap-3">
        <!-- Botón Hamburguesa -->
        <button (click)="toggleMenu()" class="md:hidden p-2 rounded-xl bg-slate-800 text-slate-200 hover:text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div>
          <h1 class="text-sm md:text-lg font-bold text-white tracking-tight">Gestión Operativa</h1>
          <p class="text-[10px] md:text-xs text-slate-400">Control de infraestructura</p>
        </div>
      </div>
      
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online
      </span>
    </header>

    <!-- CONTENIDO DINÁMICO CON PADDING ADAPTATIVO -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900/40 via-slate-950 to-slate-950">
      
      <!-- Eliminamos "max-w-7xl mx-auto" para que use el 100% del monitor -->
      <div class="w-full">
        <router-outlet></router-outlet>
      </div>
      
    </div>
  </main>

</div>
